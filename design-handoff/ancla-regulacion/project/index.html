<head>
<meta charset="utf-8" />

<title>Ancla · Métodos para calmarte</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --font-display: "Newsreader", "Georgia", serif;
    --font-body:    "Inter", -apple-system, system-ui, sans-serif;
    --font-mono:    "JetBrains Mono", ui-monospace, monospace;

    --c-bg:    #F5F2EE;
    --c-card:  #FBF9F5;
    --c-text:  #2C2C2A;
    --c-muted: #57544E;
    --c-faint: #8B8780;
    --c-body:  #6a6560;
    --c-bdr:   rgba(44,44,42,0.07);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--c-bg); color: var(--c-text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }

  /* Headings stay in Newsreader regardless of override scopes */
  h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; letter-spacing: -0.012em; }

  /* Reset buttons */
  button { font: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; padding: 0; }

  /* Hide native scrollbars on inner scrollers we control */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* Inputs */
  input[type="text"] {
    width: 100%;
    font: 400 17px/1.4 var(--font-body);
    color: var(--c-text);
    background: var(--c-card);
    border: 1px solid var(--c-bdr);
    border-radius: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color .2s ease, background .2s ease;
  }
  input[type="text"]:focus { border-color: rgba(44,44,42,0.32); background: #fff; }
  input[type="text"]::placeholder { color: var(--c-faint); }

  /* Soft focus ring for buttons (a11y) */
  button:focus-visible { outline: 2px solid rgba(44,44,42,0.4); outline-offset: 2px; border-radius: 12px; }

  @keyframes ancla-fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .ancla-fade-up { animation: ancla-fade-up .55s cubic-bezier(.4,0,.2,1) both; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- ext-resource-dependency: react -->
